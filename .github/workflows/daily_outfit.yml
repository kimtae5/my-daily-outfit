name: Daily Outfit & Auto Debug

on:
  schedule:
    # 한국 시간 기준 매일 오전 7시 (UTC 22:00)
    - cron: '13 21 * * *'
  workflow_dispatch: # GitHub 웹에서 버튼을 눌러 수동 실행도 가능하게 설정

jobs:
  run-outfit-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Actions 봇에 커밋/푸시 쓰기 권한 부여

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # aider가 git 히스토리를 볼 수 있도록 전체 히스토리 가져오기

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git User
        run: |
          git config --global user.name "Aider-Auto-Fix-Bot"
          git config --global user.email "aider-bot@users.noreply.github.com"

      - name: Run Pipeline (Recommend & Auto-Debug)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITY_NAME: "Seoul"
        run: |
          python run_pipeline.py

      - name: Commit and Push Auto-Debug Changes
        if: always() # 디버깅으로 코드나 보고서가 수정되었다면 항상 깃허브에 반영
        run: |
          git add recommend_outfit.py debug_report.md
          git commit -m "fix: auto-debug code and update report via aider" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
